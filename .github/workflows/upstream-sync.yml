name: Upstream sync

# Daily merge of openchamber/openchamber@main into the subscription feature
# branch. Cron times are UTC: 0 18 * * * runs 02:00 Asia/Shanghai every day.
# Scheduled workflows only run from the repository's default branch (main).
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-ai-pro-subscription
          fetch-depth: 0

      - name: Merge upstream main into the subscription branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/openchamber/openchamber.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with openchamber/openchamber@main."
            exit 0
          fi

          if git merge upstream/main --no-edit; then
            git push origin HEAD:feat/google-ai-pro-subscription
            echo "Merged upstream/main cleanly and pushed to feat/google-ai-pro-subscription."
            exit 0
          fi

          git merge --abort
          branch="upstream-sync/latest"
          git push --force-with-lease origin "refs/remotes/upstream/main:refs/heads/$branch"
          gh pr create \
            --repo "$GH_REPO" \
            --base feat/google-ai-pro-subscription \
            --head "$branch" \
            --title "Upstream sync: manual merge needed" \
            --body "The daily sync could not merge openchamber/openchamber@main into feat/google-ai-pro-subscription automatically. This pull request tracks the latest upstream tip; resolve the conflicts here or merge upstream/main locally, then close it." \
            || echo "An upstream-sync pull request already exists; its head was updated to the latest upstream tip."
          echo "::warning::Upstream merge has conflicts; the upstream-sync pull request was opened or updated for manual resolution."
